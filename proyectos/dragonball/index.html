<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball</title>
    <link rel="stylesheet" href="css/styleDb.css">

</head>

<body>
    <header>
        <nav class="nav">
            <img src="img/logo.png" alt="Logo dragon ball" class="logo">
            <ul class="nav-list">
                <li class="nav-item"><button class="btn btn-header" id="ver-todos">Ver todos</button></li>
                <li class="nav-item"><button class="btn btn-header human" id="human">Human</button></li>
                <li class="nav-item"><button class="btn btn-header saiyan" id="saiyan">Saiyan</button></li>
                <li class="nav-item"><button class="btn btn-header namekian" id="namekian">Namekian</button></li>
                <li class="nav-item"><button class="btn btn-header majin" id="majin">Majin</button></li>
                <li class="nav-item"><button class="btn btn-header frieza-race" id="frieza-race">Frieza Race</button></li>
                <li class="nav-item"><button class="btn btn-header android" id="android">Android</button></li>
                <li class="nav-item"><button class="btn btn-header jiren-race" id="jiren-race">Jiren Race</button></li>
                <li class="nav-item"><button class="btn btn-header god" id="god">God</button></li>
                <li class="nav-item"><button class="btn btn-header angel" id="angel">Angel</button></li>
                <li class="nav-item"><button class="btn btn-header evil" id="evil">Evil</button></li>
                <li class="nav-item"><button class="btn btn-header nucleico" id="nucleico">Nucleico</button></li>
                <li class="nav-item"><button class="btn btn-header nucleico-benigno" id="nucleico-benigno">Nucleico Benigno</button></li>
                <li class="nav-item"><button class="btn btn-header unknown" id="unknown">Unknown</button></li>
            </ul>
        </nav>
    </header>

    <main>
        
        <div id="todos">
            <div class="personaje-todos" id="listaPersonajes">

            </div>
        </div>

    </main>
    <script src="js/main.js"></script>
</body>
</html>
